id: home
title: Remote Control

layout:
  type: grid
  columns: 2
  children:
    - id: lock
      include: app-engine/blocks/confirm.yaml
      visible:
        bind: context.capabilities.screen
      label: Lock screen
      confirm: Lock the screen now?
      call: com.deskconn.remotecontrol.screen.lock

    - id: locked
      include: app-engine/blocks/poll.yaml
      visible:
        bind: context.capabilities.screen
      label: Screen locked
      read: com.deskconn.remotecontrol.screen.islocked
      every: 5

    - id: brightness
      include: app-engine/blocks/slider.yaml
      visible:
        bind: context.capabilities.brightness
      label: Brightness
      min: 1
      max: 100
      step: 1
      read: com.deskconn.remotecontrol.screen.brightness.get
      set: com.deskconn.remotecontrol.screen.brightness.set

    - id: mute
      include: app-engine/blocks/toggle.yaml
      visible:
        bind: context.capabilities.audio
      label:
        on: Unmute
        off: Mute
      read: com.deskconn.remotecontrol.audio.ismuted
      toggle: com.deskconn.remotecontrol.audio.togglemute
