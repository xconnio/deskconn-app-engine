id: home
title: Media

layout:
  type: grid
  columns: 3
  children:
    - id: previous
      include: app-engine/blocks/button.yaml
      visible:
        bind: context.capabilities.media-player
      label: Previous
      call: com.deskconn.remotecontrol.mpris.previous

    - id: play-pause
      include: app-engine/blocks/button.yaml
      visible:
        bind: context.capabilities.media-player
      label: Play / pause
      call: com.deskconn.remotecontrol.mpris.playpause

    - id: next
      include: app-engine/blocks/button.yaml
      visible:
        bind: context.capabilities.media-player
      label: Next
      call: com.deskconn.remotecontrol.mpris.next
